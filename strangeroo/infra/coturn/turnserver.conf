# coturn TURN server configuration for Strangeroo
# Reference: https://github.com/coturn/coturn/wiki/turnserver

# Listening port
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=65535

# Realm (change to your domain in production)
realm=strangeroo.app

# Use HMAC-based time-limited credentials (short-lived TURN creds per session)
use-auth-secret
static-auth-secret=change_me_coturn_static_auth_secret

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Disable CLI (security best practice)
no-cli

# Deny local loopback relay (security)
no-loopback-peers
no-multicast-peers

# Fingerprint on TURN messages
fingerprint

# Enable long-term credential mechanism
lt-cred-mech
